<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f73">
<link rel="manifest" href="manifest.json">
<title>خدمة الأسر</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17304d;font-family:Arial,Tahoma,sans-serif}
header{background:#123f73;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:23px}header small{opacity:.85}
main{max-width:720px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#eef5ff;border-radius:14px;padding:15px;text-align:center}.stat b{display:block;font-size:25px;color:#123f73}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;font-size:15px}.primary{background:#1769aa;color:#fff}.muted{background:#edf1f5;color:#17304d}.danger{background:#d9534f;color:#fff}.success{background:#249a61;color:#fff}.warn{background:#e3a21a;color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid #d5dce5;border-radius:10px;font-size:15px;background:#fff}label{display:block;font-weight:bold;margin:10px 0 6px}textarea{min-height:85px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.family{display:flex;justify-content:space-between;align-items:center;gap:10px}.family h3{margin:0 0 5px}.family p{margin:3px 0;color:#69798a;font-size:13px}
.hidden{display:none}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title h2{margin:0;font-size:19px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:5}nav button{flex:1;background:#fff;border-radius:0;color:#456}.active{color:#1769aa!important;font-weight:bold}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f5f7fb}.login .card{width:min(420px,100%);text-align:center}.logo{font-size:42px;color:#123f73}
</style>
</head>
<body>
<div id="app">
<header><h1>✝ خدمة الأسر</h1><small>إدارة بيانات الأسر واجتماع المتزوجين</small></header>
<main>
<section id="home">
<div class="card"><h2>مرحبًا 👋</h2><p>بياناتك محفوظة على هذا الجهاز في النسخة الحالية.</p>
<div class="grid"><div class="stat">الأسر<b id="count">0</b></div><div class="stat">حضور آخر اجتماع<b id="lastPresent">—</b></div></div></div>
<div class="card actions"><button class="primary" onclick="show('add')">➕ إضافة أسرة</button><button class="muted" onclick="show('families')">👨‍👩‍👧‍👦 الأسر</button><button class="muted" onclick="show('attendance')">📋 الحضور</button></div>
</section>

<section id="add" class="hidden"><div class="title"><h2>إضافة أسرة</h2><button class="muted" onclick="show('families')">رجوع</button></div><div class="card">
<label>اسم الزوج</label><input id="husband"><label>رقم تليفون الزوج</label><input id="husbandPhone" inputmode="tel">
<label>اسم الزوجة</label><input id="wife"><label>رقم تليفون الزوجة</label><input id="wifePhone" inputmode="tel">
<label>العنوان</label><input id="address"><label>أسماء الأبناء وأعمارهم</label><textarea id="children"></textarea><label>ملاحظات</label><textarea id="notes"></textarea>
<div class="actions"><button class="primary" onclick="saveFamily()">💾 حفظ</button><button class="muted" onclick="clearForm()">مسح</button></div></div></section>

<section id="families" class="hidden"><div class="title"><h2>الأسر</h2><button class="primary" onclick="show('add')">➕</button></div><div class="card"><input id="search" placeholder="🔎 بحث بالاسم أو الهاتف أو العنوان" oninput="renderFamilies()"></div><div id="familyList"></div></section>
<section id="details" class="hidden"><div class="title"><h2>بيانات الأسرة</h2><button class="muted" onclick="show('families')">رجوع</button></div><div id="detailsBox"></div></section>

<section id="attendance" class="hidden"><div class="title"><h2>حضور المتزوجين</h2><button class="primary" onclick="newMeeting()">اليوم</button></div>
<div class="card"><label>تاريخ الاجتماع</label><input id="meetingDate" type="date"><div class="grid" style="margin-top:10px"><div class="stat">حاضر<b id="pCount">0</b></div><div class="stat">غائب<b id="aCount">0</b></div></div></div>
<div id="attendanceList"></div><button class="primary" style="width:100%" onclick="saveAttendance()">💾 حفظ الحضور</button></section>

<section id="reports" class="hidden"><div class="title"><h2>التقارير</h2></div><div id="reportsBox"></div></section>
</main>
<nav><button id="nHome" class="active" onclick="show('home')">🏠<br>الرئيسية</button><button id="nFamilies" onclick="show('families')">👨‍👩‍👧‍👦<br>الأسر</button><button id="nAttendance" onclick="show('attendance')">📋<br>الحضور</button><button id="nReports" onclick="show('reports')">📊<br>التقارير</button></nav>
</div>
<script>
const FK='koa_families',AK='koa_att';
let families=JSON.parse(localStorage.getItem(FK)||'[]'), attendance=JSON.parse(localStorage.getItem(AK)||'{}'), currentId=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(id){['home','add','families','details','attendance','reports'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');['nHome','nFamilies','nAttendance','nReports'].forEach(x=>$(x).classList.remove('active'));let n={home:'nHome',families:'nFamilies',attendance:'nAttendance',reports:'nReports'}[id];if(n)$(n).classList.add('active');if(id==='families')renderFamilies();if(id==='attendance')renderAttendance();if(id==='reports')renderReports();updateHome();scrollTo(0,0)}
function updateHome(){ $('count').textContent=families.length;let ds=Object.keys(attendance).sort().pop();$('lastPresent').textContent=ds?Object.values(attendance[ds]).filter(x=>x==='present').length:'—'}
function clearForm(){['husband','husbandPhone','wife','wifePhone','address','children','notes'].forEach(x=>$(x).value='')}
function saveFamily(){let f={id:Date.now(),husband:$('husband').value.trim(),husbandPhone:$('husbandPhone').value.trim(),wife:$('wife').value.trim(),wifePhone:$('wifePhone').value.trim(),address:$('address').value.trim(),children:$('children').value.trim(),notes:$('notes').value.trim()};if(!f.husband&&!f.wife){alert('اكتب اسم الزوج أو الزوجة');return}families.push(f);localStorage.setItem(FK,JSON.stringify(families));clearForm();alert('تم حفظ الأسرة ❤️');show('families')}
function renderFamilies(){let q=($('search').value||'').toLowerCase();let a=families.filter(f=>[f.husband,f.wife,f.husbandPhone,f.wifePhone,f.address].join(' ').toLowerCase().includes(q));$('familyList').innerHTML=a.length?a.map(f=>`<div class="card family"><div><h3>${esc(f.husband||'')} و ${esc(f.wife||'')}</h3><p>📞 ${esc(f.husbandPhone||f.wifePhone||'—')}</p><p>📍 ${esc(f.address||'—')}</p></div><button class="primary" onclick="openDetails(${f.id})">فتح</button></div>`).join(''):'<div class="card">لا توجد أسر.</div>'}
function openDetails(id){currentId=id;let f=families.find(x=>x.id===id);$('detailsBox').innerHTML=`<div class="card"><h2>${esc(f.husband||'')} و ${esc(f.wife||'')}</h2><p>👨 ${esc(f.husband||'—')} — ${esc(f.husbandPhone||'—')}</p><p>👩 ${esc(f.wife||'—')} — ${esc(f.wifePhone||'—')}</p><p>📍 ${esc(f.address||'—')}</p><p>👶<br>${esc(f.children||'—')}</p><p>📝 ${esc(f.notes||'—')}</p><div class="actions"><button class="danger" onclick="deleteFamily()">حذف</button></div></div>`;show('details')}
function deleteFamily(){if(confirm('حذف الأسرة؟')){families=families.filter(x=>x.id!==currentId);localStorage.setItem(FK,JSON.stringify(families));show('families')}}
function newMeeting(){$('meetingDate').value=new Date().toISOString().slice(0,10);renderAttendance()}
function renderAttendance(){let d=$('meetingDate').value||new Date().toISOString().slice(0,10);$('meetingDate').value=d;let data=attendance[d]||{};$('attendanceList').innerHTML=families.length?families.map(f=>`<div class="card family"><b>${esc(f.husband||'')} و ${esc(f.wife||'')}</b><select onchange="setStatus(${f.id},this.value)"><option value="">لم يسجل</option><option value="present" ${data[f.id]==='present'?'selected':''}>🟢 حاضر</option><option value="absent" ${data[f.id]==='absent'?'selected':''}>🔴 غائب</option><option value="excused" ${data[f.id]==='excused'?'selected':''}>🟡 اعتذار</option></select></div>`).join(''):'<div class="card">أضف الأسر أولًا.</div>';updateCounts()}
function setStatus(id,s){let d=$('meetingDate').value;if(!attendance[d])attendance[d]={};if(s)attendance[d][id]=s;else delete attendance[d][id];updateCounts()}
function updateCounts(){let v=Object.values(attendance[$('meetingDate').value]||{});$('pCount').textContent=v.filter(x=>x==='present').length;$('aCount').textContent=v.filter(x=>x==='absent').length}
function saveAttendance(){localStorage.setItem(AK,JSON.stringify(attendance));alert('تم حفظ الحضور ❤️');updateHome()}
function renderReports(){let ds=Object.keys(attendance).sort();$('reportsBox').innerHTML=ds.length?ds.reverse().map(d=>{let v=Object.values(attendance[d]);return `<div class="card"><b>📅 ${d}</b><p>🟢 حاضر: ${v.filter(x=>x==='present').length} &nbsp; 🔴 غائب: ${v.filter(x=>x==='absent').length} &nbsp; 🟡 اعتذار: ${v.filter(x=>x==='excused').length}</p></div>`}).join(''):'<div class="card">لا توجد اجتماعات مسجلة.</div>'}
$('meetingDate').addEventListener('change',renderAttendance);
</script>
</body></html>
